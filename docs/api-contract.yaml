openapi: 3.0.3
info:
  title: DataShare API
  description: API de partage de fichiers avec authentification utilisateur
  version: 1.0.0

servers:
  - url: localhost:7120
    description: Backend local ASP.NET

tags:
  - name: Users
    description: Gestion des utilisateurs
  - name: Files
    description: Gestion des fichiers

paths:
  /api/Users/{id}:
    get:
      tags: [Users]
      summary: Récupérer un utilisateur par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Utilisateur introuvable

  /api/Users/register:
    post:
      tags: [Users]
      summary: Inscription utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDto"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Données invalides

  /api/Users/login:
    post:
      tags: [Users]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Connexion réussie
          headers:
            Set-Cookie:
              description: Cookie JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Email ou mot de passe incorrect

  /api/Files/upload:
    post:
      tags: [Files]
      summary: Upload d’un fichier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFileDto"
      responses:
        "200":
          description: Fichier uploadé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

  /api/Files/download/{id}:
    post:
      tags: [Files]
      summary: Télécharger un fichier sécurisé
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDownloadRequestDto"
      responses:
        "200":
          description: Fichier téléchargé
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Mot de passe requis ou incorrect
        "404":
          description: Fichier introuvable

  /api/Files/{id}:
    get:
      tags: [Files]
      summary: Informations sur un fichier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Informations fichier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"

    delete:
      tags: [Files]
      summary: Supprimer un fichier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fichier supprimé
        "403":
          description: Accès interdit
        "404":
          description: Fichier introuvable

  /api/Files/user/{userId}:
    get:
      tags: [Files]
      summary: Liste des fichiers d’un utilisateur
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste des fichiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserFile"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        login:
          type: string
        picture:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateUserDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        login:
          type: string
        picture:
          type: string

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        userId:
          type: integer
        token:
          type: string

    UploadFileDto:
      type: object
      required: [file, idUser, endDate]
      properties:
        file:
          type: string
          format: binary
        idUser:
          type: integer
        filePassword:
          type: string
        endDate:
          type: string
          format: date-time

    UploadResponse:
      type: object
      properties:
        message:
          type: string
        fileId:
          type: integer
        fileName:
          type: string
        downloadLink:
          type: string
        expirationDate:
          type: string
          format: date-time

    FileDownloadRequestDto:
      type: object
      properties:
        password:
          type: string

    FileInfo:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        hasPassword:
          type: boolean
        creationDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        isExpired:
          type: boolean
        uploadedBy:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string

    UserFile:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        isExpired:
          type: boolean
        hasPassword:
          type: boolean
        downloadLink:
          type: string
